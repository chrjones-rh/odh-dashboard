openapi: 3.0.3
info:
  title: AI Safety Studio REST API
  version: 1.0.0
  description: REST API AI Safety Studio BFF
  license:
    name: Apache 2.0
    url: 'https://www.apache.org/licenses/LICENSE-2.0'
servers:
  - url: 'https://localhost:8080'
  - url: 'http://localhost:8080'
paths:
  /healthcheck:
    summary: Path targeted for healthcheck purposes.
    description: >-
      The REST endpoint/path used to allow a healthcheck update.
    get:
      tags:
        - K8SOperation
      responses:
        '200':
          description: 'Ok'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: healthcheck
      summary: HealthCheck
      description: HealthCheck endpoint.
  /api/v1/namespaces:
    summary: Path used to get available namespaces.
    description: >-
      The REST endpoint/path used to list available namespaces.
    get:
      tags:
        - K8SOperation
      responses:
        '200':
          description: 'Ok'
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    type: object
                    description: Metadata about the response
                  data:
                    type: object
                    properties:
                      name:
                        type: string
                        example: default-namespace
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: getNamespaces
      summary: Get Available Namespaces
      description: Returns available namespaces in the cluster.
  /api/v1/user:
    summary: Path used to Retrieve a user based on the header.
    description: >-
      The REST endpoint/path used pass all the config information needed for the UI.
    get:
      tags:
        - K8SOperation
      responses:
        '200':
          $ref: '#/components/responses/ConfigResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: getConfig
      summary: Get configuration info
      description: Gets the configuration information needed for the UI [TBD]
  /api/v1/guardrails/templates:
    summary: Path used to list guardrail configuration templates.
    description: >-
      The REST endpoint/path used to list guardrail configuration templates.
      Templates are ConfigMaps labeled with nemo-guardrails-config=true in the
      platform (dashboard) namespace, shipped by the trustyai-service-operator.
    get:
      tags:
        - Guardrails
      responses:
        '200':
          description: 'Ok'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GuardrailTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: getGuardrailTemplates
      summary: Get Guardrail Templates
      description: Returns the guardrail configuration templates available on the platform.
  /api/v1/guardrails/templates/{name}:
    summary: Path used to get a single guardrail configuration template.
    get:
      tags:
        - Guardrails
      parameters:
        - name: name
          description: Name of the guardrail template ConfigMap.
          schema:
            type: string
          in: path
          required: true
      responses:
        '200':
          description: 'Ok'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/GuardrailTemplateDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: getGuardrailTemplate
      summary: Get Guardrail Template
      description: Returns a single guardrail configuration template with its full file contents.
  /api/v1/guardrails/deployments:
    summary: Path used to list NemoGuardrails deployments in a namespace.
    get:
      tags:
        - Guardrails
      parameters:
        - $ref: '#/components/parameters/namespace'
      responses:
        '200':
          description: 'Ok'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GuardrailDeployment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: getGuardrailDeployments
      summary: Get Guardrails Deployments
      description: >-
        Returns the NemoGuardrails deployments in the given namespace, including
        status and the configuration source (template ConfigMap vs custom YAML).
    post:
      tags:
        - Guardrails
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuardrailDeploymentCreateRequest'
      responses:
        '201':
          description: 'Created'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/GuardrailDeployment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: createGuardrailDeployment
      summary: Deploy a Guardrail Template
      description: >-
        Copies the given guardrail template ConfigMap into the target namespace
        and creates a NemoGuardrails custom resource referencing it. Requires
        permission to create configmaps and nemoguardrails in the namespace.
  /api/v1/guardrails/deployments/{name}:
    summary: Path used to get a single NemoGuardrails deployment.
    get:
      tags:
        - Guardrails
      parameters:
        - name: name
          description: Name of the NemoGuardrails custom resource.
          schema:
            type: string
          in: path
          required: true
        - $ref: '#/components/parameters/namespace'
      responses:
        '200':
          description: 'Ok'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/GuardrailDeploymentDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: getGuardrailDeployment
      summary: Get Guardrails Deployment
      description: Returns a single NemoGuardrails deployment with its full specification.
    delete:
      tags:
        - Guardrails
      parameters:
        - name: name
          description: Name of the NemoGuardrails custom resource.
          schema:
            type: string
          in: path
          required: true
        - $ref: '#/components/parameters/namespace'
      responses:
        '204':
          description: 'No Content - the deployment was deleted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: deleteGuardrailDeployment
      summary: Delete Guardrails Deployment
      description: >-
        Deletes the NemoGuardrails deployment and the dashboard-created
        ConfigMap copies for it. Requires permission to delete nemoguardrails
        in the namespace. User-managed ConfigMaps are never deleted.
components:
  schemas:
    Config:
      required:
        - userId
        - clusterAdmin
      type: object
      properties:
        userId:
          type: string
          example: user@example.com
        clusterAdmin:
          type: boolean
          example: true
    BaseResource:
      allOf:
        - $ref: '#/components/schemas/BaseResourceCreate'
        - type: object
          properties:
            id:
              format: int64
              description: Output only. The unique server generated id of the resource.
              type: string
              readOnly: true
            createTimeSinceEpoch:
              format: int64
              description: Output only. Create time of the resource in millisecond since epoch.
              type: string
              readOnly: true
            lastUpdateTimeSinceEpoch:
              format: int64
              description: |-
                Output only. Last update time of the resource since epoch in millisecond
                since epoch.
              type: string
              readOnly: true
    BaseResourceCreate:
      allOf:
        - $ref: '#/components/schemas/BaseResourceUpdate'
        - type: object
          properties:
            name:
              description: |-
                The client provided name of the artifact. This field is optional. If set,
                it must be unique among all the artifacts of the same artifact type within
                a database instance and cannot be changed once set.
              type: string
    BaseResourceUpdate:
      type: object
      properties:
        customProperties:
          description: User provided custom properties which are not defined by its type.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MetadataValue'
        description:
          description: |-
            An optional description about the resource.
          type: string
        externalId:
          description: |-
            The external id that come from the clients' system. This field is optional.
            If set, it must be unique among all resources within a database instance.
          type: string

    MetadataValue:
      oneOf:
        - $ref: '#/components/schemas/MetadataIntValue'
        - $ref: '#/components/schemas/MetadataDoubleValue'
        - $ref: '#/components/schemas/MetadataStringValue'
        - $ref: '#/components/schemas/MetadataStructValue'
        - $ref: '#/components/schemas/MetadataProtoValue'
        - $ref: '#/components/schemas/MetadataBoolValue'
      discriminator:
        propertyName: metadataType
        mapping:
          MetadataBoolValue: '#/components/schemas/MetadataBoolValue'
          MetadataDoubleValue: '#/components/schemas/MetadataDoubleValue'
          MetadataIntValue: '#/components/schemas/MetadataIntValue'
          MetadataProtoValue: '#/components/schemas/MetadataProtoValue'
          MetadataStringValue: '#/components/schemas/MetadataStringValue'
          MetadataStructValue: '#/components/schemas/MetadataStructValue'
      description: A value in properties.
    MetadataIntValue:
      description: An integer (int64) property value.
      type: object
      required:
        - metadataType
        - int_value
      properties:
        int_value:
          format: int64
          type: string
        metadataType:
          type: string
          example: MetadataIntValue
          default: MetadataIntValue
    MetadataDoubleValue:
      description: A double property value.
      type: object
      required:
        - metadataType
        - double_value
      properties:
        double_value:
          format: double
          type: number
        metadataType:
          type: string
          example: MetadataDoubleValue
          default: MetadataDoubleValue
    MetadataStringValue:
      description: A string property value.
      type: object
      required:
        - metadataType
        - string_value
      properties:
        string_value:
          type: string
        metadataType:
          type: string
          example: MetadataStringValue
          default: MetadataStringValue
    MetadataStructValue:
      description: A struct property value.
      type: object
      required:
        - metadataType
        - struct_value
      properties:
        struct_value:
          description: Base64 encoded bytes for struct value
          type: string
        metadataType:
          type: string
          example: MetadataStructValue
          default: MetadataStructValue
    MetadataProtoValue:
      description: A proto property value.
      type: object
      required:
        - metadataType
        - type
        - proto_value
      properties:
        type:
          description: url describing proto value
          type: string
        proto_value:
          description: Base64 encoded bytes for proto value
          type: string
        metadataType:
          type: string
          example: MetadataProtoValue
          default: MetadataProtoValue
    MetadataBoolValue:
      description: A bool property value.
      type: object
      required:
        - metadataType
        - bool_value
      properties:
        bool_value:
          type: boolean
        metadataType:
          type: string
          example: MetadataBoolValue
          default: MetadataBoolValue

    Error:
      description: Error code and message.
      required:
        - code
        - message
      type: object
      properties:
        code:
          description: Error code
          type: string
        message:
          description: Error message
          type: string
    GuardrailConfigSummary:
      description: Best-effort summary of a NeMo Guardrails config.yaml file.
      type: object
      required:
        - modelCount
        - models
        - railFlows
        - promptCount
        - passthrough
      properties:
        modelCount:
          description: Number of model entries declared in the config.
          type: integer
        models:
          description: Model descriptors in the form "engine/model (type)".
          type: array
          items:
            type: string
        railFlows:
          description: Rail flows declared in the config, per category.
          type: array
          items:
            $ref: '#/components/schemas/GuardrailRailFlow'
        promptCount:
          description: Number of prompts declared in the config.
          type: integer
        passthrough:
          description: Whether the config sets passthrough mode (no LLM calls).
          type: boolean
    GuardrailRailFlow:
      description: A single rail flow within a NeMo Guardrails config.
      type: object
      required:
        - category
        - flow
      properties:
        category:
          description: Rail category (input, output, retrieval, dialog, tool_input, tool_output).
          type: string
        flow:
          description: Flow name.
          type: string
    GuardrailTemplate:
      description: A guardrail configuration template shipped on the platform.
      type: object
      required:
        - name
        - namespace
        - keys
        - createdAt
        - summary
      properties:
        name:
          description: Name of the template ConfigMap.
          type: string
        namespace:
          description: Namespace the template ConfigMap lives in.
          type: string
        keys:
          description: Configuration file keys contained in the ConfigMap.
          type: array
          items:
            type: string
        createdAt:
          description: Creation timestamp of the ConfigMap (RFC 3339).
          type: string
        summary:
          $ref: '#/components/schemas/GuardrailConfigSummary'
        description:
          description: Human-readable description from the guardrail-description annotation.
          type: string
        actions:
          description: Actions taken by the guardrail (for example block, mask).
          type: array
          items:
            type: string
        locations:
          description: Enforcement locations of the guardrail (input, output).
          type: array
          items:
            type: string
        tags:
          description: Tags describing the guardrail.
          type: array
          items:
            type: string
    GuardrailTemplateDetail:
      description: A guardrail configuration template with full file contents.
      allOf:
        - $ref: '#/components/schemas/GuardrailTemplate'
        - type: object
          required:
            - files
          properties:
            files:
              description: The configuration files contained in the template.
              type: array
              items:
                $ref: '#/components/schemas/GuardrailConfigFile'
    GuardrailConfigFile:
      description: A single configuration file within a guardrail ConfigMap.
      type: object
      required:
        - key
        - content
      properties:
        key:
          description: File key (for example config.yaml, rails.co, actions.py).
          type: string
        content:
          description: Full file content.
          type: string
    GuardrailCondition:
      description: A status condition on a NemoGuardrails resource.
      type: object
      required:
        - type
        - status
      properties:
        type:
          description: Condition type (for example DeploymentReady, RouteReady).
          type: string
        status:
          description: Condition status (True, False, Unknown).
          type: string
        reason:
          description: Machine-readable reason.
          type: string
        message:
          description: Human-readable message.
          type: string
        lastTransitionTime:
          description: Last transition timestamp (RFC 3339).
          type: string
    GuardrailConfigSource:
      description: A ConfigMap referenced by a NemoGuardrails deployment.
      type: object
      required:
        - name
        - found
      properties:
        name:
          description: Name of the referenced ConfigMap.
          type: string
        found:
          description: Whether the ConfigMap exists in the deployment namespace.
          type: boolean
        keys:
          description: Configuration file keys contained in the ConfigMap.
          type: array
          items:
            type: string
        hasModelSpec:
          description: Whether the config.yaml declares a models section (custom YAML mode).
          type: boolean
        isOperatorTemplate:
          description: Whether the ConfigMap is managed by the trustyai-service-operator.
          type: boolean
    GuardrailDeployment:
      description: A NemoGuardrails deployment in a namespace.
      type: object
      required:
        - name
        - namespace
        - phase
        - ready
        - createdAt
        - conditions
        - configSources
      properties:
        name:
          description: Name of the NemoGuardrails custom resource.
          type: string
        namespace:
          description: Namespace of the NemoGuardrails custom resource.
          type: string
        phase:
          description: Observed phase reported by the operator (for example Ready).
          type: string
        ready:
          description: Whether the DeploymentReady condition is True.
          type: boolean
        endpoint:
          description: In-cluster endpoint reported by the operator, when available.
          type: string
        replicas:
          description: Configured replica count.
          type: integer
        createdAt:
          description: Creation timestamp of the resource (RFC 3339).
          type: string
        conditions:
          description: Status conditions reported by the operator.
          type: array
          items:
            $ref: '#/components/schemas/GuardrailCondition'
        configSources:
          description: ConfigMaps referenced by the deployment's nemoConfigs.
          type: array
          items:
            $ref: '#/components/schemas/GuardrailConfigSource'
    GuardrailDeploymentDetail:
      description: A NemoGuardrails deployment with its full specification.
      allOf:
        - $ref: '#/components/schemas/GuardrailDeployment'
        - type: object
          properties:
            exposeRoute:
              description: Whether the deployment exposes an OpenShift route.
              type: boolean
            envVarNames:
              description: Names of environment variables defined on the deployment (values are never returned).
              type: array
              items:
                type: string
            nemoConfigs:
              description: The nemoConfigs entries of the resource spec.
              type: array
              items:
                $ref: '#/components/schemas/GuardrailNemoConfig'
    GuardrailNemoConfig:
      description: A single nemoConfigs entry of a NemoGuardrails resource.
      type: object
      required:
        - name
        - configMaps
        - default
      properties:
        name:
          description: Config identifier used as the mount directory name.
          type: string
        configMaps:
          description: ConfigMaps that comprise the configuration.
          type: array
          items:
            type: string
        default:
          description: Whether this config is the nemo-server default.
          type: boolean
    GuardrailDeploymentCreateRequest:
      description: Request to deploy a guardrail template into a namespace.
      type: object
      required:
        - name
        - namespace
        - templateName
      properties:
        name:
          description: >-
            Name for the NemoGuardrails deployment. Must be a DNS-1123 compliant
            lowercase name (max 63 characters).
          type: string
          example: my-pii-guardrail
        namespace:
          description: Target namespace for the deployment.
          type: string
          example: my-project
        templateName:
          description: Name of the guardrail template ConfigMap to deploy from.
          type: string
          example: trustyai-service-operator-nemo-guardrails-default-pii
    SortOrder:
      description: Supported sort direction for ordering result entities.
      enum:
        - ASC
        - DESC
      type: string
    OrderByField:
      description: Supported fields for ordering result entities.
      enum:
        - CREATE_TIME
        - LAST_UPDATE_TIME
        - Id
      type: string

  responses:
    NotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: The specified resource was not found
    BadRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Bad Request parameters
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Unauthorized
    Forbidden:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Forbidden - the user does not have permission to access this resource
    InternalServerError:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Unexpected internal server error
    ConfigResponse:
      content:
        application/json:
          schema:
            type: object
            properties:
              metadata:
                type: object
                description: Metadata about the response
              data:
                $ref: '#/components/schemas/Config'
      description: A response containing a list of Config entities.
    ConflictResponse:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Conflict - Role Binding with the same name already exists

  parameters:
    id:
      name: id
      description: The ID of resource.
      schema:
        type: string
      in: path
      required: true
    name:
      examples:
        name:
          value: entity-name
      name: name
      description: Name of entity to search.
      schema:
        type: string
      in: query
      required: false
    externalId:
      examples:
        externalId:
          value: '10'
      name: externalId
      description: External ID of entity to search.
      schema:
        type: string
      in: query
      required: false
    parentResourceId:
      examples:
        parentResourceId:
          value: '10'
      name: parentResourceId
      description: ID of the parent resource to use for search.
      schema:
        type: string
      in: query
      required: false
    pageSize:
      examples:
        pageSize:
          value: '100'
      name: pageSize
      description: Number of entities in each page.
      schema:
        type: string
      in: query
      required: false
    nextPageToken:
      name: nextPageToken
      description: Token to use to retrieve next page of results.
      schema:
        type: string
      in: query
      required: false
    orderBy:
      style: form
      explode: true
      examples:
        orderBy:
          value: Id
      name: orderBy
      description: Specifies the order by criteria for listing entities.
      schema:
        $ref: '#/components/schemas/OrderByField'
      in: query
      required: false
    sortOrder:
      style: form
      explode: true
      examples:
        sortOrder:
          value: DESC
      name: sortOrder
      description: 'Specifies the sort order for listing entities, defaults to ASC.'
      schema:
        $ref: '#/components/schemas/SortOrder'
      in: query
      required: false
    namespace:
      name: namespace
      description: The namespace to filter resources by.
      schema:
        type: string
      in: query
      required: false

  securitySchemes:
    Bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Bearer JWT scheme
security:
  - Bearer: []
tags:
  - name: K8SOperation
    description: Operation performed in Kubernetes
  - name: Guardrails
    description: NeMo Guardrails templates and deployments
